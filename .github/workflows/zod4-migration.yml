name: Zod 4 migration verification
on:
  push:
    branches: [security/zod4-lockfile-isolated]
permissions:
  contents: write
jobs:
  prepare-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Match project npm
        run: npm install --global npm@10.9.4
      - name: Generate verified lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate Zod 4 package lock"
            git push
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit (reports baseline Next.js vulnerability)
        if: always()
        run: npm audit --omit=dev --audit-level=high
